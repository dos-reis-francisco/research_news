name: Digest nocturne

on:
  schedule:
    # Chaque nuit a 03:00 UTC (04:00 ou 05:00 heure francaise selon DST)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # declenchement manuel depuis l'onglet Actions

permissions:
  contents: write   # necessaire pour pusher sur gh-pages

concurrency:
  group: digest
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (branche main)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generer le digest
        run: |
          python3 research_news.py --no-browser --ci
        env:
          # Optionnel : cle API Semantic Scholar (a definir dans Settings > Secrets)
          S2_API_KEY: ${{ secrets.S2_API_KEY }}

      - name: Copier les assets PWA dans la sortie
        run: |
          cp -v public/manifest.json output/manifest.json
          cp -v public/sw.js output/sw.js
          cp -v icons/icon-192.png output/icon-192.png
          cp -v icons/icon-512.png output/icon-512.png

      - name: Deployer sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: false
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Digest auto ${{ github.run_id }}"
